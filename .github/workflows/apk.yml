name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -q PixelVillage.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar
        working-directory: PixelVillage
        run: gradle assembleDebug --no-daemon
      - name: Nombrar APK con la versión
        run: |
          V=$(grep -oP 'val gameVersion = "\K[^"]+' PixelVillage/app/build.gradle.kts)
          echo "VERSION=$V" >> $GITHUB_ENV
          cp PixelVillage/app/build/outputs/apk/debug/app-debug.apk PixelVillage-$V.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PixelVillage-${{ env.VERSION }}
          path: PixelVillage-${{ env.VERSION }}.apk
